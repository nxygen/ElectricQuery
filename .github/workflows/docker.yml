name: Docker Build & Publish

# 触发规则：
#   - master 分支：构建并推送镜像（commit SHA 作为标签）
#   - dev 分支：构建并推送带 :dev 标签的镜像
#   - tag 推送（v*）：多架构构建，使用版本号标签
on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

env:
  # GitHub Container Registry
  GH_REGISTRY: ghcr.io
  GH_IMAGE_NAME: ${{ github.repository_owner }}/electricquery
  # 阿里云
  ALI_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ALI_IMAGE_NAME: nxygen/electricquery

jobs:
  # ── 普通构建（master / dev 分支）─────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 前端构建 ──────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── 后端构建 ──────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: false

      - name: Build backend binary (linux/amd64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags="
            -s -w
            -X electricquery/internal/config.appVersion=${{ github.sha }}
          " -o bin/electricquery ./cmd/server

      # ── 决定标签 ──────────────────────────────────────────────
      - name: Compute tags
        id: tags
        run: |
          GH_IMAGE="${{ env.GH_REGISTRY }}/${{ env.GH_IMAGE_NAME }}"
          ALI_IMAGE="${{ env.ALI_REGISTRY }}/${{ env.ALI_IMAGE_NAME }}"
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            GH_TAGS="${GH_IMAGE}:dev ${GH_IMAGE}:${GITHUB_SHA::8}"
            ALI_TAGS="${ALI_IMAGE}:dev ${ALI_IMAGE}:${GITHUB_SHA::8}"
          else
            GH_TAGS="${GH_IMAGE}:${GITHUB_SHA::8}"
            ALI_TAGS="${ALI_IMAGE}:${GITHUB_SHA::8}"
          fi
          echo "gh_tags=${GH_TAGS}" >> $GITHUB_OUTPUT
          echo "ali_tags=${ALI_TAGS}" >> $GITHUB_OUTPUT

      # ── 登录 GitHub Container Registry ───────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 登录阿里云容器镜像服务 ────────────────────────────────
      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALI_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          password: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      # ── 构建并推送（GitHub）────────────────────────────────────
      - name: Build and push (GitHub Container Registry)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.gh_tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 构建并推送（阿里云）────────────────────────────────────
      - name: Build and push (Alibaba Cloud Container Registry)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.ali_tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 多平台构建（仅 tag 推送时）──────────────────────────────────
  buildx:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 登录两个 Registry ────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALI_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          password: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      # ── 推送到 GitHub ─────────────────────────────────────────
      - name: Build and push multi-arch (GitHub)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.GH_REGISTRY }}/${{ env.GH_IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.GH_REGISTRY }}/${{ env.GH_IMAGE_NAME }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 推送到阿里云 ──────────────────────────────────────────
      - name: Build and push multi-arch (Alibaba Cloud)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.ALI_REGISTRY }}/${{ env.ALI_IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.ALI_REGISTRY }}/${{ env.ALI_IMAGE_NAME }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
