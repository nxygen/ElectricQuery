# ============================================================
# ElectricQuery 单容器部署
# ============================================================
#
# 用法：
#   1. 复制一份 .env，填入实际配置
#      cp .env.example .env
#
#   2. 启动
#      docker compose up -d
#
#   3. 查看日志
#      docker compose logs -f
#
# 生产环境建议使用 Docker Secret 或外部配置中心管理敏感信息
# ============================================================

services:
  electricquery:
    image: ghcr.io/nxygen/electricquery:latest
    container_name: electricquery
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # ── 数据库 ──────────────────────────────────────────────
      EQ_DB_DRIVER: ${EQ_DB_DRIVER:-sqlite}
      EQ_SQLITE_PATH: ${EQ_SQLITE_PATH:-/app/data/electricquery.db}
      EQ_MYSQL_HOST: ${EQ_MYSQL_HOST:-127.0.0.1}
      EQ_MYSQL_PORT: ${EQ_MYSQL_PORT:-3306}
      EQ_MYSQL_USER: ${EQ_MYSQL_USER:-root}
      EQ_MYSQL_PASSWORD: ${EQ_MYSQL_PASSWORD:-}
      EQ_MYSQL_DBNAME: ${EQ_MYSQL_DBNAME:-electricquery}
      EQ_DB_MAX_OPEN: ${EQ_DB_MAX_OPEN:-25}
      EQ_DB_MAX_IDLE: ${EQ_DB_MAX_IDLE:-5}

      # ── 应用 ────────────────────────────────────────────────
      EQ_JWT_SECRET: ${EQ_JWT_SECRET:-change-me-in-production}
      EQ_ADMIN_TOKEN: ${EQ_ADMIN_TOKEN:-change-me-in-production}
      EQ_INTERNAL_TOKEN: ${EQ_INTERNAL_TOKEN:-change-me-in-production}

      # ── 日志 ────────────────────────────────────────────────
      EQ_LOG_LEVEL: ${EQ_LOG_LEVEL:-info}
      EQ_LOG_PATH: ${EQ_LOG_PATH:-/app/logs}
      EQ_LOG_MAX_SIZE_MB: ${EQ_LOG_MAX_SIZE_MB:-10}
      EQ_LOG_MAX_BACKUPS: ${EQ_LOG_MAX_BACKUPS:-7}

      # ── 调度器 ──────────────────────────────────────────────
      EQ_POLL_INTERVAL: ${EQ_POLL_INTERVAL:-3600}

      # ── CORS ────────────────────────────────────────────────
      EQ_ALLOWED_ORIGIN: ${EQ_ALLOWED_ORIGIN:-*}

      # ── 水电查询 ────────────────────────────────────────────
      EQ_LOGIN_URL: ${EQ_LOGIN_URL:-}
      EQ_TIMEOUT_SECONDS: ${EQ_TIMEOUT_SECONDS:-30}

    volumes:
      # 持久化日志和数据到主机目录，HOST_PERSIST_ROOT 可在 .env 中配置
      - ${HOST_PERSIST_ROOT:-./persist}/logs:/app/logs
      - ${HOST_PERSIST_ROOT:-./persist}/data:/app/data
      # 主机上的配置文件路径，可在 .env 中定义 HOST_CONFIG_FILE
      - ${HOST_CONFIG_FILE:-./application.conf}:/app/application.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

