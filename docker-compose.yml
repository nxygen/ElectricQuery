# ============================================================
# ElectricQuery 单容器部署
# ============================================================
#
# 用法：
#   1. 复制一份 .env，填入实际配置
#      cp .env.example .env
#
#   2. 启动
#      docker compose up -d
#
#   3. 查看日志
#      docker compose logs -f
#
# 生产环境建议使用 Docker Secret 或外部配置中心管理敏感信息
# ============================================================

services:
  electricquery:
    image: ghcr.io/nxygen/electricquery:latest
    container_name: electricquery
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # ── 数据库 ──────────────────────────────────────────────
      EQ_DB_TYPE: ${EQ_DB_TYPE:-mysql}
      EQ_DB_HOST: ${EQ_DB_HOST:-localhost}
      EQ_DB_PORT: ${EQ_DB_PORT:-3306}
      EQ_DB_USER: ${EQ_DB_USER:-root}
      EQ_DB_PASSWORD: ${EQ_DB_PASSWORD:-}
      EQ_DB_NAME: ${EQ_DB_NAME:-electricquery}
      EQ_DB_MAX_OPEN: ${EQ_DB_MAX_OPEN:-25}
      EQ_DB_MAX_IDLE: ${EQ_DB_MAX_IDLE:-5}

      # ── 应用 ────────────────────────────────────────────────
      EQ_JWT_SECRET: ${EQ_JWT_SECRET:-change-me-in-production}
      EQ_ADMIN_TOKEN: ${EQ_ADMIN_TOKEN:-change-me-in-production}
      EQ_INTERNAL_TOKEN: ${EQ_INTERNAL_TOKEN:-change-me-in-production}

      # ── 日志 ────────────────────────────────────────────────
      EQ_LOG_LEVEL: ${EQ_LOG_LEVEL:-info}
      EQ_LOG_PATH: ${EQ_LOG_PATH:-/app/logs}
      EQ_LOG_MAX_SIZE_MB: ${EQ_LOG_MAX_SIZE_MB:-10}
      EQ_LOG_MAX_BACKUPS: ${EQ_LOG_MAX_BACKUPS:-7}

      # ── 调度器 ──────────────────────────────────────────────
      EQ_SCHEDULER_INTERVAL: ${EQ_SCHEDULER_INTERVAL:-3600}
      EQ_SCHEDULER_ALERT_THRESHOLD: ${EQ_SCHEDULER_ALERT_THRESHOLD:-20}
      EQ_SCHEDULER_WEEKDAY: ${EQ_SCHEDULER_WEEKDAY:-6}
      EQ_SCHEDULER_WEEKDAY_HOUR: ${EQ_SCHEDULER_WEEKDAY_HOUR:-20}
      EQ_SKIP_SYNC: ${EQ_SKIP_SYNC:-0}

      # ── 通知 ────────────────────────────────────────────────
      EQ_NOTIFIER_WEBHOOK_URL: ${EQ_NOTIFIER_WEBHOOK_URL:-}

      # ── 速率限制 ────────────────────────────────────────────
      EQ_RATE_LIMIT_ENABLED: ${EQ_RATE_LIMIT_ENABLED:-true}
      EQ_RATE_LIMIT_LOGIN_MAX: ${EQ_RATE_LIMIT_LOGIN_MAX:-10}
      EQ_RATE_LIMIT_LOGIN_WINDOW: ${EQ_RATE_LIMIT_LOGIN_WINDOW:-300}
      EQ_RATE_LIMIT_REGISTER_MAX: ${EQ_RATE_LIMIT_REGISTER_MAX:-5}
      EQ_RATE_LIMIT_REGISTER_WINDOW: ${EQ_RATE_LIMIT_REGISTER_WINDOW:-600}

      # ── CORS ────────────────────────────────────────────────
      EQ_CORS_ALLOWED_ORIGINS: ${EQ_CORS_ALLOWED_ORIGINS:-*}

      # ── 水电查询 ────────────────────────────────────────────
      EQ_POWER_CHECKER_LOGIN_URL: ${EQ_POWER_CHECKER_LOGIN_URL:-}
      EQ_POWER_CHECKER_USER_AGENT: ${EQ_POWER_CHECKER_USER_AGENT:-Mozilla/5.0}
      EQ_POWER_CHECKER_TIMEOUT: ${EQ_POWER_CHECKER_TIMEOUT:-30}

      # 配置文件路径（默认 /app/application.conf）
      CONFIG_PATH: /app/application.conf
    volumes:
      # 持久化日志（可选，生产环境建议挂载到 host 目录）
      - electricquery-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  electricquery-logs:
